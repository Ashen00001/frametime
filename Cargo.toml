[package]
name = "frametime"
version = "0.1.0"
edition = "2021"
description = "Trace performance problems in frame-time captures from any game, and compare runs honestly"
license = "MIT"
readme = "README.md"
keywords = ["gaming", "frametime", "presentmon", "performance", "stutter"]
categories = ["command-line-utilities", "development-tools::profiling"]

[lib]
name = "frametime"
path = "src/lib.rs"

[[bin]]
name = "frametime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 4
